name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.35.0). Required for manual dispatch.'
        required: false
        type: string
      play_track:
        description: 'Play Store track to publish to'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      play_status:
        description: 'Play Store release status'
        required: false
        default: 'DRAFT'
        type: choice
        options:
          - DRAFT
          - COMPLETED

permissions:
  contents: read

# Prevent concurrent release runs — queues new pushes rather than running them
# in parallel, which would create conflicting GitHub Releases and Play edits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build & Publish Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # build-release uses `gh release upload` which authenticates via the
      # `GH_TOKEN` env var, not git-stored credentials, so the persisted
      # credential is unused — turn it off to satisfy zizmor's `artipacked`
      # audit and avoid the credential leaking into uploaded artifacts.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}

      # Resolve TAG and VERSION: prefer release-please outputs; fall back to the
      # workflow_dispatch `tag` input so manual re-publishes work end-to-end.
      - name: Resolve version and tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          echo "TAG=${INPUT_TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${INPUT_TAG#v}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-android-build

      # -- Re-mask signing secrets so they are redacted even if a Gradle
      # plugin, stack trace, or diagnostic task echoes environment state.
      - name: Mask signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

      # -- Prepare release signing ----------------------------------------
      - name: Decode Keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Write signing credentials to ~/.gradle/gradle.properties (chmod 600)
      # instead of exporting them as plain environment variables. Gradle reads
      # project properties from this file without ever printing them.
      - name: Write signing credentials to Gradle properties
        if: steps.keystore.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          {
            printf 'watchbuddy.signing.storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'watchbuddy.signing.keyAlias=%s\n' "$KEY_ALIAS"
            printf 'watchbuddy.signing.keyPassword=%s\n' "$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties
          chmod 600 ~/.gradle/gradle.properties

      # -- Check Play Store credentials -----------------------------------
      - name: Check Play Store credentials
        id: play-store
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret not set — skipping Play Store upload."
          fi

      # -- Signed release builds (APK + AAB) ------------------------------
      # Build phone + TV in a single Gradle invocation so the `core` module
      # compiles once and the task graph is resolved once.
      # Signing credentials (KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are
      # intentionally absent here — they were written to ~/.gradle/gradle.properties
      # above and Gradle reads them as project properties, keeping them out of
      # the environment and therefore out of any env-dump diagnostics or logs.
      - name: Build signed Phone + TV release (APK + AAB)
        if: steps.keystore.outputs.available == 'true'
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          VERSION_NAME: ${{ needs.release-please.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TOKEN_BACKEND_URL: ${{ secrets.TOKEN_BACKEND_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew :app-phone:assembleRelease :app-phone:bundleRelease :app-tv:assembleRelease :app-tv:bundleRelease

      # -- Collect release artifacts ---------------------------------------
      - name: Collect release artifacts
        run: |
          mkdir -p release-assets

          # Release APKs (when available)
          for apk in app-phone/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] && cp "$apk" "release-assets/watchbuddy-phone-${VERSION}-release.apk"
          done
          for apk in app-tv/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] && cp "$apk" "release-assets/watchbuddy-tv-${VERSION}-release.apk"
          done

          # Release AABs (when available)
          for aab in app-phone/build/outputs/bundle/release/*.aab; do
            [ -f "$aab" ] && cp "$aab" "release-assets/watchbuddy-phone-${VERSION}-release.aab"
          done
          for aab in app-tv/build/outputs/bundle/release/*.aab; do
            [ -f "$aab" ] && cp "$aab" "release-assets/watchbuddy-tv-${VERSION}-release.aab"
          done

          # Native debug symbols (AGP emits these when debugSymbolLevel is set).
          # Play Console uses them to symbolicate native crashes / ANRs (#262).
          # AGP embeds the per-AAB symbols under BUNDLE-METADATA when
          # debugSymbolLevel = "FULL", so Play auto-associates them. The merged
          # and per-module zips here are kept as GitHub-Release artefacts for
          # sideloaders and manual crash triage.
          PHONE_SYMS="app-phone/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          TV_SYMS="app-tv/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          if [ -f "$PHONE_SYMS" ]; then
            cp "$PHONE_SYMS" "release-assets/watchbuddy-phone-${VERSION}-native-debug-symbols.zip"
          fi
          if [ -f "$TV_SYMS" ]; then
            cp "$TV_SYMS" "release-assets/watchbuddy-tv-${VERSION}-native-debug-symbols.zip"
          fi
          if [ -f "$PHONE_SYMS" ] || [ -f "$TV_SYMS" ]; then
            SYMS_STAGE="/tmp/native-debug-symbols-input"
            rm -rf "$SYMS_STAGE" && mkdir -p "$SYMS_STAGE"
            [ -f "$PHONE_SYMS" ] && cp "$PHONE_SYMS" "$SYMS_STAGE/phone.zip"
            [ -f "$TV_SYMS" ]    && cp "$TV_SYMS"    "$SYMS_STAGE/tv.zip"
            bash .github/scripts/merge-native-debug-symbols.sh \
              "$SYMS_STAGE" \
              "$GITHUB_WORKSPACE/release-assets/watchbuddy-${VERSION}-native-debug-symbols.zip"
          fi

          # ProGuard/R8 mapping files — Play Console needs these to de-obfuscate
          # stack traces (#273). Keep per-module copies as GitHub-Release
          # artefacts; the Play upload consumes them from play-artifacts/.
          PHONE_MAPPING="app-phone/build/outputs/mapping/release/mapping.txt"
          TV_MAPPING="app-tv/build/outputs/mapping/release/mapping.txt"
          if [ -f "$PHONE_MAPPING" ]; then
            cp "$PHONE_MAPPING" "release-assets/watchbuddy-phone-${VERSION}-mapping.txt"
          fi
          if [ -f "$TV_MAPPING" ]; then
            cp "$TV_MAPPING" "release-assets/watchbuddy-tv-${VERSION}-mapping.txt"
          fi

          ls -lh release-assets/

      # -- Stage artefacts for the Play upload ----------------------------
      # Gradle Play Publisher's artifactDir mode uploads every AAB it finds
      # in the given directory as part of one atomic Play edit.  For each
      # AAB it pairs a sibling `<name>.mapping.txt` as the deobfuscation
      # file uploaded per versionCode (#273), so phone and TV crashes are
      # symbolicated with their respective R8 mappings.
      - name: Stage Play artifacts
        if: steps.keystore.outputs.available == 'true'
        run: |
          mkdir -p play-artifacts
          PHONE_AAB="app-phone/build/outputs/bundle/release/app-phone-release.aab"
          TV_AAB="app-tv/build/outputs/bundle/release/app-tv-release.aab"
          # Be forgiving about AGP's bundle naming — fall back to glob.
          [ -f "$PHONE_AAB" ] || PHONE_AAB=$(ls app-phone/build/outputs/bundle/release/*.aab 2>/dev/null | head -n1 || true)
          [ -f "$TV_AAB" ]    || TV_AAB=$(ls    app-tv/build/outputs/bundle/release/*.aab    2>/dev/null | head -n1 || true)

          if [ -n "$PHONE_AAB" ] && [ -f "$PHONE_AAB" ]; then
            cp "$PHONE_AAB" "play-artifacts/phone.aab"
            if [ -f "app-phone/build/outputs/mapping/release/mapping.txt" ]; then
              cp "app-phone/build/outputs/mapping/release/mapping.txt" "play-artifacts/phone.mapping.txt"
            fi
          fi

          if [ -n "$TV_AAB" ] && [ -f "$TV_AAB" ]; then
            cp "$TV_AAB" "play-artifacts/tv.aab"
            if [ -f "app-tv/build/outputs/mapping/release/mapping.txt" ]; then
              cp "app-tv/build/outputs/mapping/release/mapping.txt" "play-artifacts/tv.mapping.txt"
            fi
          fi

          ls -lh play-artifacts/

      # -- Upload to GitHub Release ----------------------------------------
      - name: Upload release assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in release-assets/*.apk release-assets/*.aab release-assets/*-native-debug-symbols.zip release-assets/*-mapping.txt; do
            [ -f "$file" ] && gh release upload "${TAG}" "$file" --clobber
          done

      # -- Append download links to release notes -------------------------
      - name: Update Release Notes with download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          REPO: ${{ github.repository }}
          ASSETS_DIR: release-assets
        run: bash .github/scripts/append-download-links.sh

      # -- Extract changelog for Play Store --------------------------------
      - name: Generate Play Store changelog
        env:
          RELEASE_BODY: ${{ needs.release-please.outputs.body }}
        run: |
          # Strip markdown formatting for plain-text Play Store listing
          NOTES=$(echo "$RELEASE_BODY" | sed -E \
            -e 's/^\*\*([^*]+)\*\*/\1/g' \
            -e 's/\*\*//g' \
            -e 's/\[#[0-9]+\]\([^)]*\)//g' \
            -e 's/\[([^]]*)\]\([^)]*\)/\1/g' \
            -e 's/\([0-9a-f]{7}\)//g' \
            -e 's/, *closes *//g' \
            -e 's/[[:space:]]*$//g')

          # Trim leading/trailing blank lines
          NOTES=$(echo "$NOTES" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/{ $d; N; ba; }')

          # Play Store limits "What's New" to 500 characters
          if [ ${#NOTES} -gt 500 ]; then
            NOTES="${NOTES:0:497}..."
          fi

          # For workflow_dispatch re-publishes the release body is empty; write placeholder notes.
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::notice::Release body is empty — writing placeholder Play Store notes."
            NOTES_DIR="app-phone/src/main/play/release-notes"
            for LOCALE in en-US de-DE fr-FR es-ES; do
              mkdir -p "${NOTES_DIR}/${LOCALE}"
              echo "Bug fixes and improvements." > "${NOTES_DIR}/${LOCALE}/default.txt"
            done
            exit 0
          fi

          # Write locale files — all locales get the same English text
          # (matches supported languages: EN, DE, FR, ES). Gradle Play Publisher
          # reads per-locale release notes from `src/main/play/release-notes/<locale>/default.txt`.
          NOTES_DIR="app-phone/src/main/play/release-notes"
          for LOCALE in en-US de-DE fr-FR es-ES; do
            mkdir -p "${NOTES_DIR}/${LOCALE}"
            echo "$NOTES" > "${NOTES_DIR}/${LOCALE}/default.txt"
          done

          echo "--- Play Store changelog (en-US) ---"
          cat "${NOTES_DIR}/en-US/default.txt"
          echo "--- ${#NOTES} characters ---"
          echo "--- files in ${NOTES_DIR}/ ---"
          ls -la "${NOTES_DIR}"/*/

      # -- Determine Play Store release status ------------------------------
      - name: Determine Play Store release status
        id: play-status
        run: |
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if [ "$MAJOR" -ge 1 ]; then
            echo "status=COMPLETED" >> "$GITHUB_OUTPUT"
          else
            echo "status=DRAFT" >> "$GITHUB_OUTPUT"
          fi

      # -- Write Play service-account credentials to disk -------------------
      # Gradle Play Publisher reads the service account JSON from a file
      # pointed to by GOOGLE_PLAY_SERVICE_ACCOUNT_FILE (consumed by the
      # `play { }` block in app-phone/build.gradle.kts).
      - name: Write Play service account file
        if: steps.keystore.outputs.available == 'true' && steps.play-store.outputs.available == 'true'
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_PLAY_KEY" > /tmp/gpp-sa.json
          chmod 600 /tmp/gpp-sa.json
          echo "GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=/tmp/gpp-sa.json" >> "$GITHUB_ENV"

      # -- Publish to Google Play Store ------------------------------------
      # Gradle Play Publisher uploads every AAB it finds under `artifactDir`
      # (play-artifacts/) as part of a single atomic Play edit, pairing each
      # AAB with its sibling `<name>.mapping.txt` as the deobfuscation file
      # per versionCode. This addresses #273: phone and TV crashes are now
      # symbolicated with their respective R8 mappings.
      - name: Publish to Google Play via GPP
        if: steps.keystore.outputs.available == 'true' && steps.play-store.outputs.available == 'true'
        run: ./gradlew :app-phone:publishReleaseBundle -PplayTrack=${{ inputs.play_track || 'internal' }} -PplayStatus=${{ inputs.play_status || steps.play-status.outputs.status }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: watchbuddy-release-${{ needs.release-please.outputs.version }}
          path: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/*-native-debug-symbols.zip
            release-assets/*-mapping.txt

      # -- Clean up sensitive files on disk ----------------------------------
      # Runs unconditionally (even on failure) so secrets are never left on a
      # potentially-reused runner between jobs.
      - name: Clean up signing credentials
        if: always()
        run: |
          rm -f /tmp/release.keystore /tmp/gpp-sa.json
          if [ -f ~/.gradle/gradle.properties ]; then
            sed -i '/^watchbuddy\.signing\./d' ~/.gradle/gradle.properties
          fi

  update-stable:
    name: Update stable branch
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Persisted credentials are required so the next step can `git push
      # origin stable --force`. zizmor's `artipacked` audit warns that the
      # credential could leak via uploaded artifacts — this job uploads none.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Fast-forward stable branch to release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          git checkout -B stable "$TAG"
          git push origin stable --force
