name: Build Android APKs

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'release-please--')"
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            android:
              - 'app-phone/**'
              - 'app-tv/**'
              - 'core/**'
              - 'build-logic/**'
              - '*.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - '.github/actions/**'
              - 'config/detekt/**'

  test-and-build:
    name: Test & Build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Static analysis — detekt runs on every subproject; baselines commit the
      # accepted legacy findings. Any new finding fails the build.
      - name: Run detekt
        run: ./gradlew detektAll

      # Android Lint — abortOnError is set on both app modules. Debug variant is
      # sufficient for PR feedback; release-variant lint runs as part of release.yml.
      - name: Run Android Lint
        run: ./gradlew :app-phone:lintDebug :app-tv:lintDebug

      # Always gather SARIF so PRs that failed lint/detekt still get inline
      # annotations in the Files-changed tab. Flatten to unique names because
      # upload-sarif rejects duplicate basenames across subdirectories.
      - name: Collect SARIF reports
        if: always()
        run: |
          mkdir -p sarif-reports
          while IFS= read -r f; do
            mod=$(echo "$f" | cut -d/ -f1)
            name=$(basename "$f")
            cp "$f" "sarif-reports/${mod}-${name}"
          done < <(find app-phone app-tv core -type f -name "*.sarif" 2>/dev/null)
          ls -la sarif-reports/

      # CodeQL Action v4 requires a unique category per SARIF run, so each file
      # is uploaded on its own. See
      # https://github.blog/changelog/2025-07-21-code-scanning-will-stop-combining-multiple-sarif-runs-uploaded-in-the-same-sarif-file/
      - name: Upload app-phone detekt SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: sarif-reports/app-phone-detekt.sarif
          category: app-phone-detekt

      - name: Upload app-phone lint SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: sarif-reports/app-phone-lint-results-debug.sarif
          category: app-phone-lint

      - name: Upload app-tv detekt SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: sarif-reports/app-tv-detekt.sarif
          category: app-tv-detekt

      - name: Upload app-tv lint SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: sarif-reports/app-tv-lint-results-debug.sarif
          category: app-tv-lint

      - name: Upload core detekt SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: sarif-reports/core-detekt.sarif
          category: core-detekt

      - name: Archive analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-analysis-reports
          path: |
            app-phone/build/reports/detekt/
            app-tv/build/reports/detekt/
            core/build/reports/detekt/
            app-phone/build/reports/lint-results-debug.*
            app-tv/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Post PR lint summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Count findings in each detekt XML report (Checkstyle-style).
            const countDetekt = (file) => {
              if (!fs.existsSync(file)) return 0;
              const xml = fs.readFileSync(file, 'utf8');
              return (xml.match(/<error /g) || []).length;
            };

            // Count findings in an Android Lint SARIF by severity.
            const countSarif = (file) => {
              if (!fs.existsSync(file)) return { error: 0, warning: 0, note: 0 };
              const sarif = JSON.parse(fs.readFileSync(file, 'utf8'));
              const counts = { error: 0, warning: 0, note: 0 };
              for (const run of sarif.runs || []) {
                for (const result of run.results || []) {
                  const level = result.level || 'warning';
                  if (counts[level] !== undefined) counts[level]++;
                }
              }
              return counts;
            };

            const modules = ['app-phone', 'app-tv', 'core'];
            const detekt = modules.map((m) => ({
              module: m,
              count: countDetekt(path.join(m, 'build/reports/detekt/detekt.xml')),
            }));
            const lint = ['app-phone', 'app-tv'].map((m) => ({
              module: m,
              counts: countSarif(path.join(m, 'build/reports/lint-results-debug.sarif')),
            }));

            const totalDetekt = detekt.reduce((a, b) => a + b.count, 0);
            const totalLintError = lint.reduce((a, b) => a + b.counts.error, 0);
            const totalLintWarn = lint.reduce((a, b) => a + b.counts.warning, 0);

            const body = [
              '<!-- watchbuddy-lint-report -->',
              '### Static analysis summary',
              '',
              '> Baseline-covered legacy findings are suppressed. Numbers below are **new** findings on this PR.',
              '',
              '**detekt (Kotlin)**',
              '',
              '| Module | New findings |',
              '|---|---|',
              ...detekt.map((d) => `| \`${d.module}\` | ${d.count} |`),
              `| **Total** | **${totalDetekt}** |`,
              '',
              '**Android Lint**',
              '',
              '| Module | Errors | Warnings | Notes |',
              '|---|---|---|---|',
              ...lint.map((l) => `| \`${l.module}\` | ${l.counts.error} | ${l.counts.warning} | ${l.counts.note} |`),
              `| **Total** | **${totalLintError}** | **${totalLintWarn}** | — |`,
              '',
              'Inline annotations are posted to the **Files changed** tab via GitHub code scanning. Full HTML reports are attached as the `static-analysis-reports` workflow artifact.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- watchbuddy-lint-report -->';

            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const found = existing.find((c) => c.body && c.body.includes(marker));

            if (found) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: found.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Surface a filtered failure excerpt from the failing job's raw log as
      # a PR comment keyed by the `<!-- watchbuddy-build-log -->` marker, so
      # both humans and MCP agents can read it without touching the Actions
      # UI. See CLAUDE.md § "Monitoring PR checks & accessing build logs".
      - name: Post failing build log
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MARKER: '<!-- watchbuddy-build-log -->'
          CURRENT_JOB: ${{ github.job }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const pr = context.issue.number;

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id, per_page: 100 },
            );
            const job =
              jobs.find((j) => j.name.startsWith(process.env.CURRENT_JOB)) ||
              jobs.find((j) => j.conclusion === 'failure');
            if (!job) {
              core.warning('No failing job found in this run');
              return;
            }

            const resp = await github.request(
              'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
              { owner, repo, job_id: job.id },
            );
            const raw =
              typeof resp.data === 'string'
                ? resp.data
                : Buffer.from(resp.data).toString('utf8');

            const patterns = [
              /^FAILURE:/i,
              /^BUILD FAILED/i,
              /> Task .* FAILED/,
              /^e: /,
              /\.kt:\d+:\d+/,
              /^\s*Error: /i,
              /<failure[\s>]/,
              / error /,
              /^Exception |Caused by: /,
              /AssertionError|AssertionFailedError/,
              /Prettier.*would reformat/i,
            ];
            const lines = raw.split('\n');
            const keep = new Set();
            lines.forEach((ln, i) => {
              if (patterns.some((p) => p.test(ln))) {
                const start = Math.max(0, i - 5);
                const end = Math.min(lines.length - 1, i + 20);
                for (let k = start; k <= end; k++) keep.add(k);
              }
            });
            const excerpt = [...keep]
              .sort((a, b) => a - b)
              .map((i) => lines[i])
              .join('\n');
            const clipped =
              excerpt.length > 55000
                ? excerpt.slice(-55000) + '\n… (truncated — open the Actions UI for the full log)'
                : excerpt;

            const body = [
              process.env.MARKER,
              `### Build failure — \`${job.name}\` (run ${run_id})`,
              `Actions log: ${job.html_url}`,
              `Agent access: \`pull_request_read\` with \`method: "get_comments"\` for this excerpt.`,
              '',
              '```text',
              clipped || '(no filter matches — open the Actions log linked above)',
              '```',
            ].join('\n');

            const existingComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr, per_page: 100 },
            );
            const found = existingComments.find(
              (c) => c.body && c.body.includes(process.env.MARKER),
            );
            if (found) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: found.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr,
                body,
              });
            }
