name: Daily Issue Review & Labeling

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  review:
    name: Review & Label Issues
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Configure git
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath .githooks
          # Wire git authentication through gh CLI so Stage-3 git push works
          # without persist-credentials on the checkout step.
          gh auth setup-git

      - name: Ensure workflow labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "ready for specification" \
            --color "0075ca" \
            --description "Issue is clear and ready for a detailed specification" \
            --repo justb81/watchbuddy 2>/dev/null || true
          gh label create "ready to implement" \
            --color "e4e669" \
            --description "Issue has a specification and is ready to implement" \
            --repo justb81/watchbuddy 2>/dev/null || true
          gh label create "in progress" \
            --color "fbca04" \
            --description "Implementation is actively in progress" \
            --repo justb81/watchbuddy 2>/dev/null || true

      - name: Run daily issue review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          claude --dangerously-skip-permissions \
                 --model claude-sonnet-4-6 \
                 --print \
                 "$(cat .claude/commands/daily-issue-review.md)"
