name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'release-please--')"
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  test:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Run tests
        run: npm test

      # Surface a filtered failure excerpt from the failing job's raw log as
      # a PR comment keyed by the `<!-- watchbuddy-backend-log -->` marker,
      # so both humans and MCP agents can read it without touching the
      # Actions UI. See CLAUDE.md § "Monitoring PR checks & accessing build
      # logs".
      - name: Post failing backend log
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          MARKER: '<!-- watchbuddy-backend-log -->'
          CURRENT_JOB: ${{ github.job }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const pr = context.issue.number;

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id, per_page: 100 },
            );
            const job =
              jobs.find((j) => j.name.startsWith(process.env.CURRENT_JOB)) ||
              jobs.find((j) => j.conclusion === 'failure');
            if (!job) {
              core.warning('No failing job found in this run');
              return;
            }

            const resp = await github.request(
              'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
              { owner, repo, job_id: job.id },
            );
            const raw =
              typeof resp.data === 'string'
                ? resp.data
                : Buffer.from(resp.data).toString('utf8');

            const patterns = [
              / error /,
              /^\s*Error: /i,
              /Prettier.*would reformat/i,
              /AssertionError|expect\(.*\)\.to/,
              /^\s*at .+ \(.+:\d+:\d+\)/,
              /FAIL /,
              /Tests:.*failed/i,
            ];
            const lines = raw.split('\n');
            const keep = new Set();
            lines.forEach((ln, i) => {
              if (patterns.some((p) => p.test(ln))) {
                const start = Math.max(0, i - 5);
                const end = Math.min(lines.length - 1, i + 20);
                for (let k = start; k <= end; k++) keep.add(k);
              }
            });
            const excerpt = [...keep]
              .sort((a, b) => a - b)
              .map((i) => lines[i])
              .join('\n');
            const clipped =
              excerpt.length > 55000
                ? excerpt.slice(-55000) + '\n… (truncated — open the Actions UI for the full log)'
                : excerpt;

            const body = [
              process.env.MARKER,
              `### Backend failure — \`${job.name}\` (run ${run_id})`,
              `Actions log: ${job.html_url}`,
              `Agent access: \`pull_request_read\` with \`method: "get_comments"\` for this excerpt.`,
              '',
              '```text',
              clipped || '(no filter matches — open the Actions log linked above)',
              '```',
            ].join('\n');

            const existingComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr, per_page: 100 },
            );
            const found = existingComments.find(
              (c) => c.body && c.body.includes(process.env.MARKER),
            );
            if (found) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: found.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr,
                body,
              });
            }
